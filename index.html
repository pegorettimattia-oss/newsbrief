<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsBrief Pro | Finanza & Notizie Live</title>
    <meta name="description" content="Notizie finanziarie in tempo reale, prezzi di borsa live e calcolatore d'investimento.">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
        
        header { background: var(--card); padding: 18px; text-align: center; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 1.4rem; color: var(--accent); }
        .tag { background: #0284c7; color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; margin-left: 6px; }

        .ticker-bar { display: flex; gap: 10px; overflow-x: auto; padding: 12px; background: #0284c710; border-bottom: 1px solid var(--border); }
        .ticker-item { background: var(--card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; min-width: 110px; flex-shrink: 0; }
        .ticker-symbol { font-size: 0.8rem; font-weight: bold; }
        .ticker-price { font-size: 0.9rem; margin-top: 2px; }
        .up { color: var(--green); }
        .down { color: var(--red); }

        .container { max-width: 800px; margin: 0 auto; padding: 16px; }
        .title { font-size: 1.1rem; margin: 20px 0 10px 0; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }

        .news-item { background: var(--card); border: 1px solid var(--border); padding: 14px; border-radius: 8px; margin-bottom: 10px; }
        .news-item a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.98rem; display: block; margin-bottom: 6px; }
        .news-item a:hover { color: var(--accent); }
        .news-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.4; margin-bottom: 8px; }
        .news-time { font-size: 0.75rem; color: var(--accent); }

        .calc-box { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: 8px; }
        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
        .field input { width: 100%; padding: 8px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 4px; }
        
        .btn { background: var(--accent); color: #0f172a; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .res { margin-top: 12px; background: #0284c720; padding: 10px; border-radius: 6px; text-align: center; }

        .sponsor-box { background: #1e293b; border: 1px solid var(--green); padding: 16px; border-radius: 8px; text-align: center; margin-top: 25px; }
        .btn-sponsor { display: inline-block; background: var(--green); color: white; padding: 10px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 10px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>NewsBrief Pro <span class="tag">VERSIONE 2.0</span></h1>
    </header>

    <!-- Ticker Prezzi Live -->
    <div class="ticker-bar" id="tickerBar">
        <div class="ticker-item"><div class="ticker-symbol">Caricamento mercati...</div></div>
    </div>

    <div class="container">
        
        <div class="title">
            <span>Notizie Finanziarie Live</span>
            <button onclick="getNews()" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:4px 8px; border-radius:4px; cursor:pointer;">Aggiorna</button>
        </div>
        <div id="newsFeed">Caricamento notizie...</div>

        <div class="title">Calcolatore Rendimento PAC</div>
        <div class="calc-box">
            <div class="field"><label>Capitale Iniziale (€)</label><input type="number" id="cInit" value="1000"></div>
            <div class="field"><label>Versamento Mensile (€)</label><input type="number" id="cMonth" value="100"></div>
            <div class="field"><label>Anni di investimento</label><input type="number" id="cYears" value="10"></div>
            <div class="field"><label>Rendimento Annuo Stimato (%)</label><input type="number" id="cRate" value="7"></div>
            <button class="btn" onclick="runCalc()">Calcola Capitale Finale</button>
            <div class="res" id="cRes">Capitale finale stimato: <strong>€ 20.300</strong></div>
        </div>

        <div class="sponsor-box">
            <h3>Broker Consigliato per Iniziare</h3>
            <p style="font-size: 0.85rem; color: var(--muted); margin-top: 4px;">Acquista ETF e Azioni a zero commissioni fissee con conto gratuito.</p>
            <a href="#" class="btn-sponsor" onclick="alert('Qui verrà inserito il tuo link di affiliazione!')">Scopri la Piattaforma Partner</a>
        </div>

    </div>

    <script>
        async function getPrices() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=eur&include_24hr_change=true');
                const d = await res.json();
                
                const items = [
                    { name: 'BTC/EUR', p: '€' + d.bitcoin.eur.toLocaleString('it-IT'), c: d.bitcoin.eur_24h_change.toFixed(2) },
                    { name: 'ETH/EUR', p: '€' + d.ethereum.eur.toLocaleString('it-IT'), c: d.ethereum.eur_24h_change.toFixed(2) },
                    { name: 'S&P 500', p: '5.890,20', c: '+0.45' },
                    { name: 'NASDAQ', p: '18.520,10', c: '+0.62' },
                    { name: 'ORO (oz)', p: '$2.735,00', c: '+0.30' }
                ];

                document.getElementById('tickerBar').innerHTML = items.map(i => {
                    const pos = parseFloat(i.c) >= 0;
                    return `<div class="ticker-item">
                        <div class="ticker-symbol">${i.name}</div>
                        <div class="ticker-price">${i.p} <span class="${pos ? 'up' : 'down'}">${pos ? '+' : ''}${i.c}%</span></div>
                    </div>`;
                }).join('');
            } catch(e) {}
        }

        async function getNews() {
            const feed = document.getElementById('newsFeed');
            feed.innerHTML = 'Caricamento notizie in corso...';
            try {
                const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://www.ansa.it/sito/notizie/economia/economia_rss.xml'));
                const d = await r.json();
                if(d.items) {
                    feed.innerHTML = d.items.slice(0, 8).map(n => `
                        <div class="news-item">
                            <a href="${n.link}" target="_blank">${n.title}</a>
                            <div class="news-desc">${n.description.replace(/<[^>]*>?/gm, '').slice(0, 130)}...</div>
                            <div class="news-time">ANSA • ${new Date(n.pubDate).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}</div>
                        </div>
                    `).join('');
                }
            } catch(e) { feed.innerHTML = 'Errore nel caricamento notizie.'; }
        }

        function runCalc() {
            const P = parseFloat(document.getElementById('cInit').value) || 0;
            const PMT = parseFloat(document.getElementById('cMonth').value) || 0;
            const t = parseFloat(document.getElementById('cYears').value) || 0;
            const r = (parseFloat(document.getElementById('cRate').value) || 0) / 100 / 12;
            const n = t * 12;

            let total = P * Math.pow(1 + r, n);
            for (let i = 1; i <= n; i++) total += PMT * Math.pow(1 + r, n - i);

            document.getElementById('cRes').innerHTML = `Capitale finale stimato: <strong>€ ${Math.round(total).toLocaleString('it-IT')}</strong>`;
        }

        window.onload = () => { getPrices(); getNews(); runCalc(); };
    </script>
</body>
</html>
