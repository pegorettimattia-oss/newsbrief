<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsBrief - Notizie Locali Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #151C2C;
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #1E293B;
            --accent: #8B5CF6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.search-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            transition: transform 0.2s;
        }

        .news-source {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .news-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .news-title a {
            color: var(--text-main);
            text-decoration: none;
        }

        .news-title a:hover {
            color: var(--primary);
        }

        .news-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .loading, .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>📰 NewsBrief</h1>
        <p class="subtitle">Notizie locali in tempo reale</p>
    </header>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Inserisci città (es. Trento)" value="Trento">
        <button class="search-btn" onclick="fetchNews()">Cerca</button>
    </div>

    <div class="info-bar">
        <span id="currentCityLabel">Città: Trento</span>
        <span id="newsCount">Caricamento...</span>
    </div>

    <main id="newsFeed">
        <div class="loading">Caricamento notizie in corso...</div>
    </main>

    <script>
        async function fetchNews() {
            const city = document.getElementById('cityInput').value.trim() || 'Trento';
            const feed = document.getElementById('newsFeed');
            const cityLabel = document.getElementById('currentCityLabel');
            const countLabel = document.getElementById('newsCount');

            cityLabel.textContent = `Città: ${city}`;
            countLabel.textContent = 'Caricamento...';
            feed.innerHTML = '<div class="loading">Ricerca notizie live per ' + city + '...</div>';

            const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(city)}&hl=it&gl=IT&ceid=IT:it`;
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    feed.innerHTML = '';
                    countLabel.textContent = `${data.items.length} notizie trovate`;

                    data.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'news-card';
                        
                        const pubDate = new Date(item.pubDate).toLocaleDateString('it-IT', {
                            day: 'numeric',
                            month: 'short',
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                        card.innerHTML = `
                            <div class="news-source">${item.author || 'Notizia Locale'}</div>
                            <h2 class="news-title">
                                <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
                            </h2>
                            <div class="news-date">📅 ${pubDate}</div>
                        `;
                        feed.appendChild(card);
                    });
                } else {
                    feed.innerHTML = '<div class="empty">Nessuna notizia trovata per questa città al momento.</div>';
                    countLabel.textContent = '0 notizie';
                }
            } catch (error) {
                feed.innerHTML = '<div class="empty">Impossibile caricare le notizie. Riprova tra poco.</div>';
                countLabel.textContent = 'Errore';
            }
        }

        // Carica subito le notizie di Trento all'apertura
        fetchNews();
    </script>
</body>
</html>
